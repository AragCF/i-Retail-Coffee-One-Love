plugins {
    id 'com.android.application'
}

android {
    namespace 'com.coffeeonelove.iretail.kozenrecovery'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coffeeonelove.iretail.kozenrecovery'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '0.1.2-read-only-recovery-double-start-guard'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
