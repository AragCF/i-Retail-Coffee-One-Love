name: AOA Recovery report

on:
  push:
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/aoa_recovery/**'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest AOA read-only recovery evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/aoa_recovery'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'AOA_RECOVERY_JL22_KOZEN_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 00_info.txt ====='
          unzip -p "$ZIP" 00_info.txt || true
          echo '===== JL22_02_recovery_logcat.txt ====='
          unzip -p "$ZIP" JL22_02_recovery_logcat.txt || true
          echo '===== KOZEN_02_recovery_logcat.txt ====='
          unzip -p "$ZIP" KOZEN_02_recovery_logcat.txt || true
          echo '===== KOZEN_04_smartsky_services.txt ====='
          unzip -p "$ZIP" KOZEN_04_smartsky_services.txt || true
