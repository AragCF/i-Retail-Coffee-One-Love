name: Prepare device binding 0.5.128
on:
  push:
    branches: ['v0.5.128-device-binding']
    paths:
      - '.github/workflows/prepare-device-binding-128.yml'
      - 'tools/prepare_device_binding_128.py'
      - 'app/src/main/java/com/coffeeonelove/iretail/ui/DeviceBinding*.kt'
      - 'app/src/test/java/com/coffeeonelove/iretail/ui/DeviceBindingTest.kt'
permissions:
  contents: write
concurrency:
  group: prepare-binding-128
  cancel-in-progress: false
jobs:
  prepare-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Apply only baseline-checked approved changes
        run: python3 tools/prepare_device_binding_128.py
      - name: Preserve existing API and money safety checks
        run: |
          python3 tools/verify_s2_catalog_money.py
          python3 tools/verify_v0_5_126_server_managed_integrations.py
          python3 tools/verify_v0_5_127_api_lifecycle.py
      - name: Run JVM tests and build without a device or live API
        run: |
          set -o pipefail
          mkdir -p binding_evidence
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :kozenBridge:assembleDebug 2>&1 | tee binding_evidence/build.log
      - name: Assert executable tests actually ran and scan runtime configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, xml.etree.ElementTree as ET
          counts={}
          for name, minimum in [('DeviceBindingTest',26),('ApiLifecycleSafetyTest',10)]:
              path=Path('app/build/test-results/testDebugUnitTest/TEST-com.coffeeonelove.iretail.ui.'+name+'.xml')
              suite=ET.parse(path).getroot()
              c={k:int(suite.attrib.get(k,'0')) for k in ['tests','failures','errors','skipped']}
              assert c['tests']>=minimum and not any(c[k] for k in ['failures','errors','skipped']),c
              counts[name]=c
          cfg=json.loads(Path('app/src/main/assets/content/iretail-api.json').read_text())
          assert not any(k in cfg for k in ['login','password','client_secret','access_token','device_code','device_id','channel_id','profile_id'])
          assert cfg['binding_required'] is True
          counts['safety']={'live_api_calls':False,'activation_attempted':False,'financial_operations':False,'physical_device_used':False}
          Path('binding_evidence/test_summary.json').write_text(json.dumps(counts,indent=2))
          print(json.dumps(counts,indent=2))
          PY
      - name: Publish only tested changes to dedicated branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          git fetch origin v0.5.128-device-binding
          test "$(git rev-parse origin/v0.5.128-device-binding)" = "$EXPECTED_HEAD"
          git config user.name 'Coffee One Love CI'
          git config user.email 'coffee-one-love-ci@users.noreply.github.com'
          rm .github/workflows/prepare-device-binding-128.yml tools/prepare_device_binding_128.py
          git add -- app .github/workflows/android-build.yml .github/workflows/prepare-device-binding-128.yml tools/prepare_device_binding_128.py BUILD_WINDOWS_CLI.bat MAIN_30_SBP_DRYRUN_UI_TEST.bat MAIN_34_SBP_EVENT_QUEUE_SYNTHETIC_TEST.bat MAIN_35_KOZEN_BRIDGE_UPGRADE_AND_SBP_QUEUE_TEST.bat MAIN_40_SBP_SERVER_CONFIG_DOC_AUDIT.bat
          git commit -m 'feat: tested device binding wizard and fail-closed API bootstrap v0.5.128'
          git push origin HEAD:v0.5.128-device-binding
          git rev-parse HEAD > binding_evidence/source_commit.txt
          git archive --format=zip HEAD > binding_evidence/tested_source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binding-0.5.128-test-evidence
          path: |
            binding_evidence/
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iRetail-v0.5.128-binding-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
