name: Binding documentation and diagnostic cleanup
on:
  push:
    branches: ['v0.5.128-device-binding']
    paths: ['.github/workflows/binding-preflight.yml']
permissions:
  contents: read
  actions: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Remove assistant-generated preflight log and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/AragCF/i-Retail-Coffee-One-Love/actions/runs/36253752452"
          echo 'Generated diagnostic run removed; activation code must be reissued before use.'
      - name: Fetch public controller documentation without authentication
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import urllib.request, ssl, json
          from pathlib import Path
          result=[]
          for name in ['iretail-device','iretail-channel','user','profile']:
              url='https://my.i-retail.com/api/apidoc/actual/app-controllers-'+name.replace('-','-')+'controller.html'
              try:
                  with urllib.request.urlopen(url,timeout=25,context=ssl.create_default_context()) as r:
                      raw=r.read(4000000)
                      Path('evidence/'+name+'.html').write_bytes(raw)
                      result.append({'controller':name,'http':r.status,'bytes':len(raw)})
              except Exception as e:result.append({'controller':name,'error':type(e).__name__})
          Path('evidence/result.json').write_text(json.dumps(result))
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: binding-public-controller-docs
          path: evidence/
          retention-days: 7
          if-no-files-found: error
