name: Vendotek readiness report

on:
  push:
    branches:
      - v0.5.25-vendotek-ready-state
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/vendotek_ready/**'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest Vendotek readiness result
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/vendotek_ready'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'VENDOTEK_READY_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 00_info.txt ====='
          unzip -p "$ZIP" 00_info.txt || true
          echo '===== 01_vendotek_ready_logcat.txt ====='
          unzip -p "$ZIP" 01_vendotek_ready_logcat.txt || true
          echo '===== 02_transport.txt ====='
          unzip -p "$ZIP" 02_transport.txt || true
