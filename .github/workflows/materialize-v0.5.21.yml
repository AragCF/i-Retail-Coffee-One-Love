name: Materialize v0.5.21 machine modes

on:
  push:
    branches:
      - v0.5.21-machine-modes
    paths:
      - 'tools/materialize_v0_5_21.py'
      - 'app/src/main/java/com/coffeeonelove/iretail/ui/MachineModeRuntime.kt'
      - '.github/workflows/materialize-v0.5.21.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v0.5.21-machine-modes
          fetch-depth: 0

      - name: Materialize guarded source changes
        run: python3 tools/materialize_v0_5_21.py

      - name: Verify diff
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build main UI and Kozen bridge
        working-directory: .
        run: gradle --no-daemon --stacktrace :app:assembleDebug :kozenBridge:assembleDebug

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            app/build.gradle \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/coffeeonelove/iretail/ui/MainActivity.kt
          git commit -m 'v0.5.21: materialize standalone and kiosk machine modes [skip ci]'
          git push origin HEAD:v0.5.21-machine-modes
