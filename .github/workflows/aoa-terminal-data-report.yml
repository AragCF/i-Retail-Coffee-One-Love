name: AOA TerminalData report

on:
  push:
    branches:
      - 'v0.5.15-terminal-data-over-aoa'
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/aoa_terminal_data/**'

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest AOA TerminalData evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/aoa_terminal_data'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'AOA_TERMINAL_DATA_JL22_KOZEN_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== JL22_02_aoa_logcat.txt ====='
          unzip -p "$ZIP" JL22_02_aoa_logcat.txt || true
          echo '===== KOZEN_02_bridge_logcat.txt ====='
          unzip -p "$ZIP" KOZEN_02_bridge_logcat.txt || true
          echo '===== KOZEN_05_smartsky_services.txt ====='
          unzip -p "$ZIP" KOZEN_05_smartsky_services.txt || true
