name: API lifecycle safety

on:
  push:
    branches: [main, 'v0.5.*']
  pull_request:

permissions:
  contents: read

jobs:
  api-lifecycle-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verify API callback and loyalty boundaries
        run: python3 tools/verify_v0_5_127_api_lifecycle.py
      - name: Execute API lifecycle JVM tests
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Assert all lifecycle cases actually ran
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          file = Path('app/build/test-results/testDebugUnitTest/TEST-com.coffeeonelove.iretail.ui.ApiLifecycleSafetyTest.xml')
          suite = ET.parse(file).getroot()
          counts = {k:int(suite.attrib.get(k, '0')) for k in ('tests','failures','errors','skipped')}
          assert counts['tests'] >= 10 and not any(counts[k] for k in ('failures','errors','skipped')), counts
          print('API_LIFECYCLE_JUNIT_OK', counts)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-lifecycle-jvm-results
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
