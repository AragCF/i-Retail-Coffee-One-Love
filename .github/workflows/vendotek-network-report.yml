name: Vendotek network access report
on:
  push:
    branches: [v0.5.33-vendotek-network-access]
    paths: ['iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/vendotek_network/**']
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Read latest limited report
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/vendotek_network')
          reports=sorted(root.glob('VENDOTEK_NETWORK_*.zip'))
          if not reports: raise SystemExit('No report archive found')
          p=reports[-1]
          print('REPORT='+p.name)
          with zipfile.ZipFile(p) as z:
              for name in ('SUMMARY.txt','01_audit.txt'):
                  info=z.getinfo(name)
                  if info.file_size>131072: raise SystemExit('Report member exceeds size limit')
                  print('\n===== '+name+' =====')
                  text=z.read(name).decode('utf-8-sig',errors='replace')
                  for line in text.splitlines(): print('REPORT | '+line)
          PY
