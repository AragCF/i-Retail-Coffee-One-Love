name: Vendotek public wiki study
on:
  push:
    branches: [v0.5.33-vendotek-network-access]
    paths: ['.github/workflows/vendotek-wiki-study.yml']
permissions:
  contents: read
jobs:
  public-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public VT and network documentation
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, json
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.text=[]; self.links=[]; self.skip=0
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','style'): self.skip+=1
                  if tag=='a' and 'href' in a: self.links.append(a['href'])
                  if tag=='img': self.text.append('[IMAGE '+a.get('src','')+' '+a.get('alt','')+']')
              def handle_endtag(self,tag):
                  if tag in ('script','style') and self.skip: self.skip-=1
              def handle_data(self,data):
                  if not self.skip and data.strip(): self.text.append(data.strip())
          for path in ('/ru/terminals/vt','/ru/setup/link','/ru/connection/protocols','/ru/setup/help_questions'):
              url='https://wiki.vendotek.ru'+path
              print('\nURL',url)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r:
                      raw=r.read(500000).decode('utf-8','replace'); print('HTTP',r.status)
                  p=Parser(); p.feed(raw)
                  print('TEXT\n'+'\n'.join(p.text)); print('LINKS',json.dumps(p.links,ensure_ascii=False))
              except Exception as e: print('FETCH_ERROR',str(e))
          PY
