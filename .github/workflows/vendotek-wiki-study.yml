name: Vendotek public wiki study
on:
  push:
    branches: [v0.5.33-vendotek-network-access]
    paths: ['.github/workflows/vendotek-wiki-study.yml']
permissions:
  contents: read
jobs:
  public-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read public wiki without credentials
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request
          for path in ('/','/robots.txt','/sitemap.xml'):
              url='https://wiki.vendotek.ru'+path
              print('\nURL',url)
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read(120000).decode('utf-8','replace')
                      print('HTTP',r.status,'FINAL_URL',r.url)
                  print(raw)
              except Exception as e: print('FETCH_ERROR',str(e))
          PY
