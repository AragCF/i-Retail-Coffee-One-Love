name: Vendotek public wiki study
on:
  push:
    branches: [v0.5.33-vendotek-network-access]
    paths: ['.github/workflows/vendotek-wiki-study.yml']
permissions:
  contents: read
jobs:
  public-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Collect public VT menu illustrations
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, json, hashlib
          from html.parser import HTMLParser
          root=pathlib.Path('wiki_illustrations'); root.mkdir()
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r: return r.read(8000000)
          for name in ('trwifim.png','trwifim1.png','trwifim2.png','mw2.png','trs1.png','trs2.png','vtk.png'):
              url='https://wiki.vendotek.ru/pics/'+name
              b=get(url); (root/name).write_bytes(b)
              print('IMAGE',name,'bytes',len(b),'sha256',hashlib.sha256(b).hexdigest())
          class Parser(HTMLParser):
              def handle_starttag(self,t,a):
                  if t in ('iframe','video','source'): print('MEDIA',t,dict(a))
          for path in ('/ru/terminals/vt/menu','/ru/setup/link/vt'):
              print('PAGE',path); p=Parser(); p.feed(get('https://wiki.vendotek.ru'+path).decode('utf-8'))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vendotek-wiki-illustrations
          path: wiki_illustrations/
          retention-days: 1
