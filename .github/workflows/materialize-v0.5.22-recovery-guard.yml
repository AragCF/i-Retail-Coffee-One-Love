name: Materialize v0.5.22 recovery guard

on:
  push:
    branches:
      - v0.5.22-payment-diagnostics
    paths:
      - 'tools/materialize_v0_5_22_recovery_guard.py'
      - '.github/workflows/materialize-v0.5.22-recovery-guard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: v0.5.22-payment-diagnostics
          fetch-depth: 0

      - name: Materialize recovery guard
        run: python3 tools/materialize_v0_5_22_recovery_guard.py

      - name: Verify diff
        run: git diff --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build read-only recovery apps
        working-directory: .
        run: gradle --no-daemon --stacktrace :kozenRecoveryBridge:assembleDebug :jl22AoaRecovery:assembleDebug

      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            kozenRecoveryBridge/build.gradle \
            kozenRecoveryBridge/src/main/java/com/coffeeonelove/iretail/kozenrecovery/RecoveryBridgeService.java \
            AOA_16_LAST_TRANSACTION_RECOVERY.bat
          git commit -m 'v0.5.22: guard read-only recovery bridge from duplicate starts [skip ci]'
          git push origin HEAD:v0.5.22-payment-diagnostics
