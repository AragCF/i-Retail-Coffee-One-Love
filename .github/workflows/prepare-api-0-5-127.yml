name: Prepare API lifecycle 0.5.127

on:
  push:
    branches: ['v0.5.127-api-lifecycle-safety']
    paths:
      - 'tools/apply_api_lifecycle_0_5_127.py'
      - '.github/workflows/prepare-api-0-5-127.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prepare-api-0-5-127
  cancel-in-progress: false

jobs:
  prepare-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare only base-checked approved changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 tools/apply_api_lifecycle_0_5_127.py | tee "$RUNNER_TEMP/api-127-preparation.log"
          python3 tools/verify_v0_5_127_api_lifecycle.py
          python3 tools/verify_v0_5_126_server_managed_integrations.py
          git diff --check
      - name: Execute JVM tests and assemble both APKs without devices
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :kozenBridge:assembleDebug | tee "$RUNNER_TEMP/api-127-build.log"
      - name: Verify executable test evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import xml.etree.ElementTree as ET
          report = Path('app/build/test-results/testDebugUnitTest/TEST-com.coffeeonelove.iretail.ui.ApiLifecycleSafetyTest.xml')
          root = ET.parse(report).getroot()
          result = {key: int(root.attrib.get(key, '0')) for key in ('tests','failures','errors','skipped')}
          assert result == {'tests': 10, 'failures': 0, 'errors': 0, 'skipped': 0}, result
          Path(os.environ['RUNNER_TEMP'], 'api-127-test-summary.json').write_text(json.dumps(result, indent=2))
          print('API_LIFECYCLE_JUNIT_OK', result)
          PY
      - name: Commit only tested source files to the dedicated branch
        env:
          TARGET_BRANCH: v0.5.127-api-lifecycle-safety
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$TARGET_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          files = Path('.git/api-127-paths.txt').read_text().splitlines()
          assert files and all(not p.startswith('.github/') for p in files)
          tracked_changes = subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(tracked_changes).issubset(set(files)), tracked_changes
          subprocess.run(['git','add','--',*files], check=True)
          PY
          git diff --cached --check
          git config user.name 'Coffee One Love CI'
          git config user.email 'coffee-one-love-ci@users.noreply.github.com'
          git commit -m 'fix: isolate API callbacks and enforce read-only loyalty in v0.5.127'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD | tee "$RUNNER_TEMP/api-127-source-commit.txt"
          echo "Tested source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '10 JVM tests passed. App and unchanged Kozen bridge APKs assembled. No device/API operations executed.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-0.5.127-preparation-evidence
          path: |
            ${{ runner.temp }}/api-127-preparation.log
            ${{ runner.temp }}/api-127-build.log
            ${{ runner.temp }}/api-127-test-summary.json
            ${{ runner.temp }}/api-127-source-commit.txt
            app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iRetail-v0.5.127-prepared-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
