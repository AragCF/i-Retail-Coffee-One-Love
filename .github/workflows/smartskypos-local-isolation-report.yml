name: SmartSkyPOS Kozen-local isolation report

on:
  push:
    branches:
      - v0.5.22-payment-diagnostics
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/smartskypos_local_isolation/**'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest Kozen-local isolation result
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/smartskypos_local_isolation'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'SMARTSKYPOS_LOCAL_ISOLATION_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 00_info.txt ====='
          unzip -p "$ZIP" 00_info.txt || true
          echo '===== 01_local_payment_logcat.txt ====='
          unzip -p "$ZIP" 01_local_payment_logcat.txt || true
          echo '===== 03_smartskypos_services.txt ====='
          unzip -p "$ZIP" 03_smartskypos_services.txt || true
          echo '===== 05_network_time.txt ====='
          unzip -p "$ZIP" 05_network_time.txt || true
