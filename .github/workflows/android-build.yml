name: Android build

on:
  push:
    branches:
      - main
      - 'v0.5.*'
  pull_request:

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Assemble debug APK
        working-directory: iRetail_Android_UI_v0.5.8_smartskypos_probe_source
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iRetail-v0.5.9-debug-apk
          path: iRetail_Android_UI_v0.5.8_smartskypos_probe_source/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
