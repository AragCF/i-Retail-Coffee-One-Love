name: Android build

on:
  push:
    branches:
      - main
      - 'v0.5.*'
  pull_request:

jobs:
  s3-admin-auth-result-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze committed admin-auth report
        run: python3 tools/analyze_s3_admin_auth_permission_report.py

  s3-admin-permission-doc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze admin permission documentation
        run: python3 tools/analyze_s3_admin_permission_docs.py

  s3-admin-inventory-result-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze committed admin device inventory
        run: python3 tools/analyze_s3_admin_device_inventory_report.py

  s3-admin-device-doc-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze admin device documentation
        run: python3 tools/analyze_s3_admin_device_docs.py

  s3-external-register-result-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze external register result and device docs
        run: python3 tools/analyze_s3_external_register_result.py

  s3-external-code-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze external_code evidence
        run: python3 tools/analyze_s3_external_code_evidence.py

  s3-device-register-result-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze committed device/register result
        run: python3 tools/analyze_s3_device_register_report.py

  s3-counter-method-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze S3 counter-source summary
        run: python3 tools/analyze_s3_counter_source_report.py

      - name: Analyze device counter methods
        run: python3 tools/analyze_s3_device_counter_methods.py

  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify repository root layout
        run: python3 tools/verify_root_layout.py

      - name: Verify S1 truthful states
        run: python3 tools/verify_s1_truthful_states.py

      - name: Verify S2 catalog and money
        run: python3 tools/verify_s2_catalog_money.py

      - name: Verify S3 dry-run order draft
        run: python3 tools/verify_s3_order_draft.py

      - name: Verify S3 DRY_RUN v2 release guard
        run: python3 tools/verify_v0_5_55_s3_dry_run_v2.py

      - name: Verify S2 catalog diagnostics
        run: python3 tools/verify_s2_catalog_diagnostics.py

      - name: Verify JL22 SSL diagnostics
        run: python3 tools/verify_ssl_diagnostics.py

      - name: Verify TLS chain probe
        run: python3 tools/verify_tls_chain_probe.py

      - name: Verify ISRG Root X1 compatibility
        run: python3 tools/verify_isrg_root_x1_compat.py

      - name: Verify Retail API curl audit
        run: python3 tools/verify_api_curl_audit.py

      - name: Verify Retail API PowerShell syntax
        shell: pwsh
        run: ./tools/Verify-RetailApiAuditPowerShell.ps1

      - name: Verify Retail API runtime patterns
        shell: pwsh
        run: ./tools/Verify-RetailApiAuditRuntimePatterns.ps1

      - name: Verify S3 order contract audit
        run: python3 tools/verify_s3_order_contract_audit.py

      - name: Verify S3 order docs PowerShell
        shell: pwsh
        run: ./tools/Verify-OrderDocsAuditPowerShell.ps1

      - name: Verify S3 order dependency audit
        run: python3 tools/verify_s3_order_dependency_audit.py

      - name: Verify S3 live reference audit
        run: python3 tools/verify_s3_live_reference_audit.py

      - name: Verify S3 live reference PowerShell
        shell: pwsh
        run: ./tools/Verify-S3LiveReferencePowerShell.ps1

      - name: Verify S3 device/service reconciliation
        run: python3 tools/verify_s3_device_service_reconciliation.py

      - name: Verify S3 device/service PowerShell
        shell: pwsh
        run: ./tools/Verify-S3DeviceServicePowerShell.ps1

      - name: Verify S3 counter-source audit
        run: python3 tools/verify_v0_5_56_s3_counter_source_audit.py

      - name: Verify S3 counter-source PowerShell
        shell: pwsh
        run: ./tools/Verify-S3CounterSourcePowerShell.ps1

      - name: Verify controlled device/register probe
        run: python3 tools/verify_v0_5_64_s3_device_register_probe.py

      - name: Verify controlled device/register PowerShell
        shell: pwsh
        run: ./tools/Verify-S3DeviceRegisterProbePowerShell.ps1

      - name: Verify S3 device-code source audit
        run: python3 tools/verify_v0_5_67_s3_device_code_source_audit.py

      - name: Verify S3 device-code source PowerShell
        shell: pwsh
        run: ./tools/Verify-S3DeviceCodeSourcePowerShell.ps1

      - name: Verify controlled external-system register probe
        run: python3 tools/verify_v0_5_70_external_register_probe.py

      - name: Verify controlled external-system register PowerShell
        shell: pwsh
        run: ./tools/Verify-S3ExternalSystemRegisterProbePowerShell.ps1

      - name: Verify S3 admin-device inventory
        run: python3 tools/verify_v0_5_73_admin_device_inventory.py

      - name: Verify S3 admin-device inventory PowerShell
        shell: pwsh
        run: ./tools/Verify-S3AdminDeviceInventoryPowerShell.ps1

      - name: Verify S3 admin-auth permission audit
        run: python3 tools/verify_v0_5_76_admin_auth_permission.py

      - name: Verify S3 admin-auth permission PowerShell
        shell: pwsh
        run: ./tools/Verify-S3AdminAuthPermissionPowerShell.ps1

      - name: Verify S3 fiscal DRY_RUN v1
        run: python3 tools/verify_v0_5_81_fiscal_dry_run.py

      - name: Verify fiscal adapter boundary
        run: python3 tools/verify_v0_5_82_fiscal_adapter_boundary.py

      - name: Verify v0.5.89 standalone safe smoke
        run: python3 tools/verify_v0_5_89_standalone_safe_smoke.py

      - name: Verify v0.5.90 fiscal positive payment contract
        run: python3 tools/verify_v0_5_90_fiscal_positive_payment_contract.py

      - name: Verify v0.5.91 fiscal positive DRY_RUN self-test
        run: python3 tools/verify_v0_5_91_fiscal_dryrun_selftest.py

      - name: Verify v0.5.92 fiscal self-test guard fix
        run: python3 tools/verify_v0_5_92_fiscal_selftest_guard_fix.py

      - name: Assemble debug APK
        working-directory: .
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iRetail-v0.5.92-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
