name: AOA SmartSky state report

on:
  push:
    branches:
      - 'v0.5.14-smartskypos-over-aoa'
    paths:
      - 'test_reports/aoa_state/**'

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest AOA SmartSky evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='test_reports/aoa_state'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'AOA_STATE_JL22_KOZEN_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== JL22_02_aoa_logcat.txt ====='
          unzip -p "$ZIP" JL22_02_aoa_logcat.txt || true
          echo '===== KOZEN_02_bridge_logcat.txt ====='
          unzip -p "$ZIP" KOZEN_02_bridge_logcat.txt || true
          echo '===== KOZEN_05_smartsky_services.txt ====='
          unzip -p "$ZIP" KOZEN_05_smartsky_services.txt || true
          echo '===== JL22_04_usb_bus.txt ====='
          unzip -p "$ZIP" JL22_04_usb_bus.txt || true
