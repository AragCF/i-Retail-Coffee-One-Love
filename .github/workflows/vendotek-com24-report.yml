name: Vendotek Windows COM24 report

on:
  push:
    branches:
      - v0.5.31-vendotek-com24
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/vendotek_com24/**'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest Vendotek Windows COM24 result
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/vendotek_com24'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'VENDOTEK_COM_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 01_probe.txt ====='
          unzip -p "$ZIP" 01_probe.txt || true
