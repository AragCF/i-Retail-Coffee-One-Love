name: AOA Payment report

on:
  push:
    paths:
      - 'test_reports/aoa_payment/**'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest AOA payment evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='test_reports/aoa_payment'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'AOA_PAYMENT_JL22_KOZEN_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 00_info.txt ====='
          unzip -p "$ZIP" 00_info.txt || true
          echo '===== JL22_02_payment_logcat.txt ====='
          unzip -p "$ZIP" JL22_02_payment_logcat.txt || true
          echo '===== KOZEN_02_bridge_logcat.txt ====='
          unzip -p "$ZIP" KOZEN_02_bridge_logcat.txt || true
          echo '===== KOZEN_04_smartsky_services.txt ====='
          unzip -p "$ZIP" KOZEN_04_smartsky_services.txt || true
