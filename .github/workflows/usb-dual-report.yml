name: USB dual diagnostic report

on:
  push:
    branches:
      - v0.5.12-usb-dual-side-probe
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/usb_dual/**'
      - '.github/workflows/usb-dual-report.yml'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract latest dual-side USB evidence
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/usb_dual'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'USB_DUAL_JL22_KOZEN_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== ARCHIVE CONTENTS ====='
          unzip -l "$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== JL22_03_usb_bus.txt ====='
          unzip -p "$ZIP" JL22_03_usb_bus.txt || true
          echo '===== KOZEN_02_dumpsys_usb.txt ====='
          unzip -p "$ZIP" KOZEN_02_dumpsys_usb.txt || true
          echo '===== KOZEN_03b_getprop_usb_filtered.txt ====='
          unzip -p "$ZIP" KOZEN_03b_getprop_usb_filtered.txt || true
