name: Main UI real payment report

on:
  push:
    branches:
      - v0.5.21-machine-modes
    paths:
      - 'iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/main_ui_payment/**'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest main UI payment diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ROOT='iRetail_Android_UI_v0.5.8_smartskypos_probe_source/test_reports/main_ui_payment'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'MAIN_UI_REAL_PAYMENT_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 00_info.txt ====='
          unzip -p "$ZIP" 00_info.txt || true
          echo '===== JL22_02_main_ui_payment_logcat.txt ====='
          unzip -p "$ZIP" JL22_02_main_ui_payment_logcat.txt || true
          echo '===== KOZEN_02_bridge_payment_logcat.txt ====='
          unzip -p "$ZIP" KOZEN_02_bridge_payment_logcat.txt || true
          echo '===== KOZEN_04_smartsky_services.txt ====='
          unzip -p "$ZIP" KOZEN_04_smartsky_services.txt || true
