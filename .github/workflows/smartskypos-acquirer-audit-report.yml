name: SmartSkyPOS acquiring audit report

on:
  push:
    branches:
      - v0.5.22-payment-diagnostics
    paths:
      - 'test_reports/smartskypos_acquirer_audit/**'

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract latest read-only acquiring audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT='test_reports/smartskypos_acquirer_audit'
          ZIP="$(find "$ROOT" -maxdepth 1 -type f -name 'SMARTSKYPOS_ACQUIRER_AUDIT_*.zip' -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2-)"
          echo "LATEST_ZIP=$ZIP"
          echo '===== SUMMARY.txt ====='
          unzip -p "$ZIP" SUMMARY.txt || true
          echo '===== 00_info.txt ====='
          unzip -p "$ZIP" 00_info.txt || true
          echo '===== 01_smartsky_safe_logcat.txt ====='
          unzip -p "$ZIP" 01_smartsky_safe_logcat.txt || true
          echo '===== 06_network_time_endpoint.txt ====='
          unzip -p "$ZIP" 06_network_time_endpoint.txt || true
