plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.coffeeonelove.iretail'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coffeeonelove.iretail'
        minSdk 23
        targetSdk 35
        versionCode 129
        versionName '0.5.129-binding-research'
        testInstrumentationRunner 'com.coffeeonelove.iretail.ui.BindingSmokeInstrumentation'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        aidl = true
    }
}

// v0.4.2 upgrade guard: obsolete files left by old ZIP overlays must not compile.
tasks.register('removeObsoleteV03Sources') {
    doLast {
        delete file('src/main/java/com/coffeeonelove/iretail/ui/MockGateways.kt')
    }
}

tasks.matching { task ->
    task.name.startsWith('compile') || task.name.startsWith('assemble') || task.name.startsWith('bundle')
}.configureEach {
    dependsOn tasks.named('removeObsoleteV03Sources')
}

dependencies {
    implementation 'com.google.zxing:core:3.5.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
